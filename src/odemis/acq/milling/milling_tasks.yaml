# This file defines the default milling tasks used in the application.
# Other configurations can be created by the user, but this file
# provides a starting point.
# Contains the configuration for the milling tasks in the format:
# 
# task_name:
#  milling: Milling parameters
#  patterns: List of patterns (and parameters) to mill
# spot_size_correction is the total measured excess in the milled opening size.
# It must be nonnegative and is subtracted once from each dimension sent to fibsemOS.
'Microexpansion':
  name: 'Microexpansion'
  milling:
    current: 1.0e-9
    voltage: 30000.0
    field_of_view: 8e-05
    mode: 'Serial'
    channel: 'ion'
  patterns:
    - name: 'Microexpansion'
      width: 0.5e-06
      height: 1.5e-05
      depth: 1.0e-06
      spacing: 1.0e-05
      spot_size_correction: 0.0
      center_x: 0
      center_y: 0
      pattern: 'microexpansion'
